{% extends 'layout.html' %}

{% block content %}
<div class="max-w-md mx-auto glass p-8 shadow-lg border-t-4 border-blue-500 mt-12">
    <div class="text-center mb-8">
        <h2 class="font-black text-3xl uppercase italic text-slate-900">Welcome Back</h2>
        <p class="text-sm text-slate-500 mt-2 font-medium">Enter your email to receive a secure OTP.</p>
    </div>

    <form id="emailForm" class="space-y-4">
        <input type="email" id="emailInput" required placeholder="name@company.com" class="w-full p-4 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500 bg-slate-50">
        <button type="submit" id="sendBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black tracking-widest p-4 rounded-xl uppercase text-xs transition-colors shadow-md">Send OTP</button>
    </form>

    <form id="otpForm" class="space-y-4 hidden mt-6 pt-6 border-t border-slate-100">
        <p class="text-xs text-emerald-600 font-bold text-center mb-4" id="otpMessage"></p>
        <input type="text" id="otpInput" required placeholder="Enter 6-digit OTP" pattern="\d{6}" maxlength="6" class="w-full p-4 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-500 bg-slate-50 text-center tracking-[0.5em] font-bold text-lg">
        <button type="submit" id="verifyBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black tracking-widest p-4 rounded-xl uppercase text-xs transition-colors shadow-md">Verify & Login</button>
    </form>
</div>

<script>
    const emailForm = document.getElementById('emailForm');
    const otpForm = document.getElementById('otpForm');
    let currentEmail = "";

    emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const btn = document.getElementById('sendBtn');
        
        btn.innerText = "Sending..."; btn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('email', email);
            
            const res = await fetch('/login', { method: 'POST', body: formData });
            const data = await res.json();
            
            if(data.status === 'success') {
                currentEmail = email;
                document.getElementById('emailInput').disabled = true;
                btn.classList.add('hidden');
                
                otpForm.classList.remove('hidden');
                document.getElementById('otpMessage').innerText = data.message;
            } else {
                alert(data.message);
                btn.innerText = "Send OTP"; btn.disabled = false;
            }
        } catch (err) {
            alert("Network error.");
            btn.innerText = "Send OTP"; btn.disabled = false;
        }
    });

    otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const otp = document.getElementById('otpInput').value.trim();
        const btn = document.getElementById('verifyBtn');
        
        btn.innerText = "Verifying..."; btn.disabled = true;

        try {
            const formData = new FormData();
            formData.append('email', currentEmail);
            formData.append('otp', otp);
            
            const res = await fetch('/verify', { method: 'POST', body: formData });
            const data = await res.json();
            
            if(data.status === 'success') {
                window.location.href = data.redirect;
            } else {
                alert(data.message);
                btn.innerText = "Verify & Login"; btn.disabled = false;
            }
        } catch (err) {
            alert("Network error.");
            btn.innerText = "Verify & Login"; btn.disabled = false;
        }
    });
</script>
{% endblock %}
