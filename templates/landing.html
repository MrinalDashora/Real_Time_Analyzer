<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniSense | AI Social Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        body { background: #f8fafc; font-family: 'Outfit', sans-serif; }
        .glass { background: white; border-radius: 24px; border: 1px solid #e2e8f0; }
        @media (min-width: 768px) { .glass { border-radius: 28px; } }
        .btn-press:active { transform: scale(0.96); }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-12">
    <div class="max-w-6xl mx-auto space-y-4 md:space-y-6">
        
        <header class="glass p-5 md:p-6 flex justify-between items-center shadow-sm border-b-4 border-blue-600">
            <h1 class="text-xl md:text-2xl font-black uppercase tracking-tighter italic text-slate-900">CogniSense</h1>
            <a href="/studio" class="bg-slate-900 text-white px-6 md:px-8 py-3 rounded-xl text-[10px] font-black uppercase btn-press tracking-widest hover:bg-slate-800 transition-colors">Access Dashboard</a>
        </header>

        <main class="glass p-8 md:p-16 lg:p-24 text-center shadow-sm relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-blue-50 blur-3xl rounded-full -z-10"></div>
            <div class="inline-block px-4 py-2 rounded-xl bg-blue-50 border border-blue-100 text-blue-600 text-[10px] font-black uppercase tracking-widest mb-6">Enterprise NLP Engine V3.0</div>
            <h2 class="text-4xl md:text-6xl lg:text-7xl font-black tracking-tighter leading-tight text-slate-900 mb-6 uppercase italic">
                Understand your audience.<br><span class="text-blue-600">Instantly.</span>
            </h2>
            <p class="text-sm md:text-base text-slate-500 mb-10 max-w-2xl mx-auto leading-relaxed font-medium">
                Stop counting keywords. Start understanding context. CogniSense uses advanced semantic analysis to audit channels, analyze streams, and run head-to-head competitive matrices.
            </p>
            <a href="/studio" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-10 py-5 rounded-xl font-black uppercase tracking-widest text-xs transition-all btn-press shadow-lg shadow-blue-200">
                Launch CogniSense
            </a>
        </main>
    </div>
</body>
</html>
